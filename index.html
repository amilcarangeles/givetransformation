<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="Give Transformation, organización sin fines de lucro dedicada a la educación, el desarrollo humano y la solidaridad en República Dominicana." name="description"/><title>Give Transformation | Transformando vidas</title><style>:root{--navy:#102b3f;--green:#159b79;--light:#f3f8f7;--muted:#597080}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);line-height:1.6}header{position:sticky;top:0;background:#fff;box-shadow:0 2px 15px #102b3f15;z-index:5}.wrap{max-width:1160px;margin:auto;padding:0 25px}nav{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:76px}.brand{font-size:20px;font-weight:850;letter-spacing:-.5px}.brand span{color:var(--green)}nav .links{display:flex;gap:20px;flex-wrap:wrap}a{color:inherit;text-decoration:none}nav a:hover{color:var(--green)}.btn{display:inline-block;background:var(--green);color:#fff;padding:13px 22px;border-radius:8px;font-weight:700}.btn.alt{background:white;color:var(--navy)}.hero{background:linear-gradient(110deg,#102b3ff0,#102b3fba),url('https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=1800&q=80') center/cover;color:white;padding:135px 0}.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.08;max-width:800px;margin:15px 0}.hero p{font-size:20px;max-width:680px;color:#e1ebed}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800;color:var(--green)}section{padding:88px 0}h2{font-size:clamp(30px,4vw,45px);line-height:1.2;margin:10px 0 20px}p{color:var(--muted)}.hero p,.dark p{color:#d8e7eb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{border:1px solid #e1e9e8;border-radius:16px;padding:30px;background:white;box-shadow:0 8px 22px #0a263008}.card h3{font-size:21px;margin:10px 0}.card .num{color:var(--green);font-size:28px;font-weight:800}.light{background:var(--light)}.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.visual{background:linear-gradient(145deg,#d4f2e9,#b5d8e2);border-radius:20px;min-height:370px;display:grid;place-items:center;padding:50px;text-align:center;font-size:55px}.dark{background:var(--navy);color:#fff}.dark h2{color:white}.pill{display:inline-block;border:1px solid #b9d9d1;border-radius:99px;padding:6px 12px;margin:5px;font-size:13px;color:var(--navy)}.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}input,textarea{width:100%;padding:14px;margin:0 0 13px;border:1px solid #d3dfdf;border-radius:8px;font:inherit}button{border:0;cursor:pointer;font:inherit}footer{background:#071d2b;color:white;padding:36px 0;font-size:14px}footer p{color:#c4d1d8}.note{font-size:12px;color:#6a7d84}.center{text-align:center}.center p{max-width:680px;margin:0 auto 35px}@media(max-width:800px){nav{align-items:flex-start;padding:18px 0;flex-direction:column}nav .links{gap:12px;font-size:13px}.grid,.split,.contact{grid-template-columns:1fr}.hero{padding:90px 0}section{padding:65px 0}.visual{min-height:230px}}
/* Sección Quiénes somos — Give Transformation */
.about-premium{background:linear-gradient(130deg,#fff 0%,#fff 60%,#f5faf9 100%);overflow:hidden;padding:105px 0!important}
.about-grid{display:grid;grid-template-columns:1.03fr 1fr;align-items:center;gap:70px}
.about-copy .eyebrow{font-size:14px;letter-spacing:3px;font-weight:800;color:#008b76;display:flex;align-items:center;gap:18px;margin-bottom:24px}
.eyebrow-line{height:2px;width:48px;background:#79bfb8;display:inline-block}
.about-copy h2{font-size:clamp(38px,4.2vw,65px);line-height:1.12;letter-spacing:-2px;color:#092b46;margin:0 0 28px;font-weight:850}
.about-copy h2 em{font-style:normal;color:#07966f}
.about-copy p{font-size:18px;line-height:1.8;color:#63758a;max-width:660px;margin:0 0 24px}
.about-values{display:flex;gap:12px;flex-wrap:wrap;margin-top:35px}
.value-tag{display:flex;align-items:center;gap:12px;border-radius:70px;padding:12px 18px;background:#edf9f5;color:#14334b;font-weight:650;font-size:15px;line-height:1.35}
.value-tag:nth-child(2){background:#edf5ff}.value-tag:nth-child(3){background:#fff7e8}
.value-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:white;font-size:23px;background:#07966f;flex-shrink:0}.value-icon.blue{background:#2c80ec}.value-icon.amber{background:#f49b0b}
.about-photo-wrap{position:relative;min-height:510px;display:flex;align-items:center;padding:18px 36px 18px 0}
.about-accent{position:absolute;background:#1aa985;border-radius:50%;width:230px;height:230px;left:-45px;bottom:-20px}
.about-photo{height:480px;width:100%;border:12px solid white;box-shadow:0 24px 65px rgba(13,51,71,.12);border-radius:35px;overflow:hidden;position:relative;background:#d5eee6}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.about-photo:after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(7,35,51,.65));pointer-events:none}
.photo-label{position:absolute;bottom:25px;left:28px;z-index:1;color:white;font-size:19px;font-weight:750;max-width:270px}
.about-float{position:absolute;right:0;top:52px;background:#fff;border-radius:24px;padding:20px 22px;box-shadow:0 18px 55px rgba(17,51,68,.13);display:flex;flex-direction:column;gap:16px;z-index:2}
.about-float>div{display:flex;align-items:center;gap:12px}.about-float strong,.about-float small{display:block;white-space:nowrap}.about-float strong{color:#14334b;font-size:15px}.about-float small{color:#697f91;font-size:12px;margin-top:3px}
.mini-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:50%;background:#e2f7ee;color:#04966f;font-size:23px}.mini-icon.blue{background:#eaf3ff;color:#2c80ec}.mini-icon.amber{background:#fff2db;color:#ed960a}
@media(max-width:950px){.about-grid{grid-template-columns:1fr;gap:25px}.about-photo-wrap{min-height:440px;max-width:650px;width:100%;margin:auto}.about-photo{height:420px}.about-premium{padding:70px 0!important}}
@media(max-width:540px){.about-copy h2{letter-spacing:-1px}.about-copy p{font-size:16px}.about-values{gap:8px}.value-tag{font-size:12px;padding:8px 10px}.value-icon{width:34px;height:34px;font-size:18px}.about-photo-wrap{min-height:340px;padding:0 10px 0 0}.about-photo{height:340px;border-width:7px;border-radius:24px}.about-float{top:15px;right:0;padding:11px;gap:8px;border-radius:16px}.about-float strong{font-size:11px}.about-float small{font-size:9px}.mini-icon{height:30px;width:30px;font-size:16px}.photo-label{font-size:15px;bottom:16px;left:15px}}

/* Navegación responsive renovada */
.site-header{z-index:100;position:sticky;top:0;background:#fff;box-shadow:0 2px 20px #102b3f12}
.site-nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;flex-direction:row;gap:18px;padding:0}
.site-nav .brand{font-size:19px;white-space:nowrap;letter-spacing:-.45px}
.site-nav .links{display:flex;align-items:center;gap:20px;flex-wrap:nowrap}
.site-nav .links>a{font-size:16px;font-weight:650;white-space:nowrap}
.site-nav .mobile-cta,.menu-toggle{display:none}
@media(max-width:1050px){
 .site-nav{min-height:68px;padding:0;flex-direction:row;align-items:center}
 .site-nav .brand{font-size:17px}
 .site-nav .desktop-cta{display:none}
 .menu-toggle{display:flex;position:relative;z-index:102;width:44px;height:44px;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #dce9e5;border-radius:12px;background:#f4f9f7;color:#102b3f;cursor:pointer;flex-shrink:0}
 .menu-toggle span{width:19px;height:2px;border-radius:3px;background:currentColor;transition:transform .25s,opacity .2s}
 .site-header.menu-open .menu-toggle span:first-child{transform:translateY(7px) rotate(45deg)}
 .site-header.menu-open .menu-toggle span:nth-child(2){opacity:0}
 .site-header.menu-open .menu-toggle span:last-child{transform:translateY(-7px) rotate(-45deg)}
 .site-nav .links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;box-shadow:0 18px 30px #102b3f20;padding:12px max(25px,calc((100vw - 1160px)/2 + 25px)) 24px;flex-direction:column;align-items:stretch;gap:0;border-top:1px solid #edf2f1;max-height:calc(100dvh - 68px);overflow-y:auto}
 .site-header.menu-open .links{display:flex;animation:menuReveal .18s ease-out}
 .site-nav .links>a{display:flex;align-items:center;justify-content:space-between;padding:15px 8px;border-bottom:1px solid #eef3f2;font-size:15px;font-weight:650}
 .site-nav .links>a:not(.mobile-cta)::after{content:'›';font-size:24px;color:#159b79;font-weight:400}
 .site-nav .links .mobile-cta{display:flex;margin-top:17px;padding:15px 17px;border:0;border-radius:11px;background:#159b79;color:white;font-weight:750}
 .site-nav .links .mobile-cta span{font-size:20px}
 @keyframes menuReveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
}
@media(max-width:420px){.site-nav .brand{font-size:15px}.site-nav{min-height:64px}.site-nav .links{max-height:calc(100dvh - 64px)}}
@media(prefers-reduced-motion:reduce){.site-nav *, .site-nav *::after{transition:none!important;animation:none!important}}
